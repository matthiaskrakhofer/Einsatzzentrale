<svg width="960" height="560" viewBox="0 0 960 560" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font: 700 26px Arial, sans-serif; fill: #eff6fb; }
      .subtitle { font: 600 15px Arial, sans-serif; fill: #9ab4c8; letter-spacing: 0.08em; text-transform: uppercase; }
      .label { font: 700 14px Arial, sans-serif; fill: #d8efff; }
      .note { font: 600 14px Arial, sans-serif; fill: #eff6fb; }
      .small { font: 600 12px Arial, sans-serif; fill: #9ab4c8; }
      .stroke { stroke: #eff6fb; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .dot { fill: #57d8ff; }
      .tile { fill: #12293B; stroke: #2E627E; }
    </style>

    <!-- A = ┘ -->
    <symbol id="pig-a" viewBox="0 0 44 44">
      <path class="stroke" d="M36 8V36H8" />
    </symbol>

    <!-- D = top + right + bottom -->
    <symbol id="pig-d" viewBox="0 0 44 44">
      <path class="stroke" d="M8 8H36V36H8" />
    </symbol>

    <!-- E = square -->
    <symbol id="pig-e" viewBox="0 0 44 44">
      <path class="stroke" d="M8 8H36V36H8V8Z" />
    </symbol>

    <!-- F = top + left + bottom -->
    <symbol id="pig-f" viewBox="0 0 44 44">
      <path class="stroke" d="M36 8H8V36H36" />
    </symbol>

    <!-- H = top + left + right -->
    <symbol id="pig-h" viewBox="0 0 44 44">
      <path class="stroke" d="M8 36V8H36V36" />
    </symbol>

    <!-- I = ┌ -->
    <symbol id="pig-i" viewBox="0 0 44 44">
      <path class="stroke" d="M36 8H8V36" />
    </symbol>

    <!-- N = square + dot -->
    <symbol id="pig-n" viewBox="0 0 44 44">
      <use href="#pig-e" />
      <circle class="dot" cx="22" cy="22" r="3.5" />
    </symbol>

    <!-- O = F + dot -->
    <symbol id="pig-o" viewBox="0 0 44 44">
      <use href="#pig-f" />
      <circle class="dot" cx="18" cy="22" r="3.5" />
    </symbol>

    <!-- P = G + dot -->
    <symbol id="pig-p" viewBox="0 0 44 44">
      <path class="stroke" d="M8 8H36V36" />
      <circle class="dot" cx="28" cy="16" r="3.5" />
    </symbol>

    <!-- R = I + dot -->
    <symbol id="pig-r" viewBox="0 0 44 44">
      <use href="#pig-i" />
      <circle class="dot" cx="16" cy="16" r="3.5" />
    </symbol>

    <!-- T = > -->
    <symbol id="pig-t" viewBox="0 0 44 44">
      <path class="stroke" d="M10 10L32 22L10 34" />
    </symbol>

    <!-- Z = ^ + dot -->
    <symbol id="pig-z" viewBox="0 0 44 44">
      <path class="stroke" d="M10 34L22 10L34 34" />
      <circle class="dot" cx="22" cy="22" r="3.5" />
    </symbol>
  </defs>

  <rect width="960" height="560" rx="28" fill="#091722"/>
  <rect x="18" y="18" width="924" height="524" rx="22" fill="#0D2030" stroke="#1C465E" stroke-width="2"/>

  <text x="42" y="58" class="subtitle">Datei Alpha-0 / Nur verschluesselte Botschaft</text>
  <text x="42" y="96" class="title">Winkelschrift-Nachricht</text>

  <rect x="42" y="126" width="876" height="112" rx="18" fill="#101E2A" stroke="#284F66"/>
  <text x="66" y="162" class="label">Verschluesselte Botschaft</text>
  <text x="66" y="190" class="note">Die Einsatzleitung erhaelt nur diese Nachricht. Der Schluessel wird nicht eingeblendet.</text>
  <text x="66" y="214" class="small">Das Loesungswort ist ausgeschrieben. Fuer das Passwort alles klein schreiben und die Zahl als Ziffer verwenden.</text>

  <rect x="42" y="262" width="876" height="240" rx="18" fill="#0A1824" stroke="#284F66"/>

  <!-- Zeile 1: r o t e r p a -->
  <g transform="translate(92 300)">
    <rect class="tile" x="0"   y="0" width="64" height="64" rx="16"/>
    <use href="#pig-r" x="12" y="12" width="40" height="40"/>

    <rect class="tile" x="78"  y="0" width="64" height="64" rx="16"/>
    <use href="#pig-o" x="90" y="12" width="40" height="40"/>

    <rect class="tile" x="156" y="0" width="64" height="64" rx="16"/>
    <use href="#pig-t" x="168" y="12" width="40" height="40"/>

    <rect class="tile" x="234" y="0" width="64" height="64" rx="16"/>
    <use href="#pig-e" x="246" y="12" width="40" height="40"/>

    <rect class="tile" x="312" y="0" width="64" height="64" rx="16"/>
    <use href="#pig-r" x="324" y="12" width="40" height="40"/>

    <rect class="tile" x="390" y="0" width="64" height="64" rx="16"/>
    <use href="#pig-p" x="402" y="12" width="40" height="40"/>

    <rect class="tile" x="468" y="0" width="64" height="64" rx="16"/>
    <use href="#pig-a" x="480" y="12" width="40" height="40"/>
  </g>

  <!-- Zeile 2: n d a d r e i -->
  <g transform="translate(92 378)">
    <rect class="tile" x="0"   y="0" width="64" height="64" rx="16"/>
    <use href="#pig-n" x="12" y="12" width="40" height="40"/>

    <rect class="tile" x="78"  y="0" width="64" height="64" rx="16"/>
    <use href="#pig-d" x="90" y="12" width="40" height="40"/>

    <rect class="tile" x="156" y="0" width="64" height="64" rx="16"/>
    <use href="#pig-a" x="168" y="12" width="40" height="40"/>

    <rect class="tile" x="234" y="0" width="64" height="64" rx="16"/>
    <use href="#pig-d" x="246" y="12" width="40" height="40"/>

    <rect class="tile" x="312" y="0" width="64" height="64" rx="16"/>
    <use href="#pig-r" x="324" y="12" width="40" height="40"/>

    <rect class="tile" x="390" y="0" width="64" height="64" rx="16"/>
    <use href="#pig-e" x="402" y="12" width="40" height="40"/>

    <rect class="tile" x="468" y="0" width="64" height="64" rx="16"/>
    <use href="#pig-i" x="480" y="12" width="40" height="40"/>
  </g>

  <!-- Zeile 3: z e h n -->
  <g transform="translate(292 456)">
    <rect class="tile" x="0"   y="0" width="64" height="64" rx="16"/>
    <use href="#pig-z" x="12" y="12" width="40" height="40"/>

    <rect class="tile" x="78"  y="0" width="64" height="64" rx="16"/>
    <use href="#pig-e" x="90" y="12" width="40" height="40"/>

    <rect class="tile" x="156" y="0" width="64" height="64" rx="16"/>
    <use href="#pig-h" x="168" y="12" width="40" height="40"/>

    <rect class="tile" x="234" y="0" width="64" height="64" rx="16"/>
    <use href="#pig-n" x="246" y="12" width="40" height="40"/>
  </g>
</svg>
